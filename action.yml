name: "Hackable Security Scanner"
description: "Hack yourself before they do: plain-English website security scan"
author: "Shafqat Mehmood"
branding:
  icon: "shield"
  color: "red"

inputs:
  target:
    description: "URL of the app to scan (only scan apps you own or have permission to test)"
    required: true
  fail-under:
    description: "Fail the workflow if the score is below this (0-100)"
    required: false
    default: "70"
  sarif:
    description: "Upload results to GitHub code scanning (true/false)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install hackable
      shell: bash
      run: pip install hackable

    - name: Scan target
      shell: bash
      run: |
        if [ "${{ inputs.sarif }}" = "true" ]; then
          hackable --yes --fail-under "${{ inputs.fail-under }}" \
            --sarif hackable.sarif "${{ inputs.target }}"
        else
          hackable --yes --fail-under "${{ inputs.fail-under }}" \
            "${{ inputs.target }}"
        fi

    - name: Upload SARIF
      if: inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: hackable.sarif
