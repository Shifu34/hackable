[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hackable"
version = "0.1.0"
description = "Hack yourself before they do. One-command website security check for people who have never run a security tool."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shafqat Mehmood" }]
keywords = ["security", "pentest", "scanner", "web", "vulnerability", "dast"]
dependencies = ["requests"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Shifu34/hackable"

[project.scripts]
hackable = "hackable.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
